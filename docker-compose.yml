# Local development stack. Images are pinned to exact versions.
#
# - MongoDB and Redis publish NO host ports; they are reachable only from other services on the
#   compose network. MongoDB runs without authentication, which is acceptable only because of
#   that isolation. Do not publish its port without enabling auth first.
# - Only the API is published, and only on the loopback interface. The exceptions are the
#   `mongo-test` and `redis-test` services (profile `test`, ephemeral data), also loopback-only.
# - Data lives in named volumes. `make down` keeps them; only `docker compose down -v` deletes them.

name: docusearch

services:
  api:
    build: .
    image: docusearch:local
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Pin container-side values that must not depend on a developer's .env.
      APP_ENV: local
      # The service name resolves only on the compose network; a host-side .env must not override it.
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_ROOT: /data/uploads
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads_data:/data/uploads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Background worker: same image as the API, different entry point. It is not published anywhere.
  worker:
    build: .
    image: docusearch:local
    command: ["python", "-m", "docusearch.worker"]
    environment:
      APP_ENV: local
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_ROOT: /data/uploads
    env_file:
      - path: .env
        required: false
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    # A job in progress is allowed to finish on `docker compose stop` (RQ warm shutdown).
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads_data:/data/uploads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "docusearch.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:8.0.32
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Throwaway MongoDB for integration tests (`make test-integration`). Not started by `make up`.
  # Published on loopback only, on a port different from any dev instance, and with no volume:
  # data lives in tmpfs and disappears with the container.
  mongo-test:
    image: mongo:8.0.32
    profiles: ["test"]
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs:
      - /data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Throwaway Redis for integration tests (`make test-integration`), loopback only, no persistence.
  redis-test:
    image: redis:7.4.11-bookworm
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-bookworm
    # AOF persistence so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:
  uploads_data:
